name: Backend API Tests

on:
  pull_request:
    paths:
      - 'shopping/mall-app-core-api/**'

jobs:
  test-backend-api:
    name: Backend API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopping/mall-app-core-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run tests
        run: uv run --extra dev pytest tests/ -v
