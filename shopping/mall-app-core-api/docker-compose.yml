services:
  db:
    image: postgres:16-alpine
    container_name: mall-db
    environment:
      POSTGRES_USER: mall
      POSTGRES_PASSWORD: mall_dev_password
      POSTGRES_DB: mall_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mall -d mall_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mall-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mall:mall_dev_password@db:5432/mall_dev
      - DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
